; No Auto-Equip Behaviour - Mod Settings

[General]
# This parameter determines the verbosity level used by the mod for logging and communication.
# Levels of verbosity:
#    0: Only errors will be logged.
#    1: Standard information will be logged.
#    2: Advanced logging will be enabled.
iVerboseMode = 1

# Completely enables or disables the mod (1 enable, 0 disable).
bEnabled = 1


[Main]
# Clear the right hand memory slot when a two-handed weapon or bow is equipped,
# preventing the game from automatically re-equipping the previous right hand item (1 enable, 0 disable).
bHandleRightHand = 1

# Clear the left hand memory slot when a two-handed weapon or bow is equipped,
# preventing the game from automatically re-equipping the previous left hand item (1 enable, 0 disable).
bHandleLeftHand = 1

# Clear the hand memory slots if the previously held item was a one-handed weapon (1 enable, 0 disable).
bHandleWeapons = 1

# Clear the hand memory slots if the previously held item was a shield (1 enable, 0 disable).
bHandleShields = 1

# Clear the hand memory slots if the previously held item was a spell (1 enable, 0 disable).
bHandleSpells = 1

# Apply slot clearing when equipping a two-handed weapon (sword or axe) (1 enable, 0 disable).
bApplyOnTwoHanded = 1

# Apply slot clearing when equipping a bow or crossbow (1 enable, 0 disable).
bApplyOnBow = 1
